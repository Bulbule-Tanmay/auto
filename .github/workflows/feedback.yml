name: Collect Telegram feedback

# Telegram only keeps button presses for 24h, so we collect them every 6 hours
# (cheap: no AI, no scraping) instead of waiting for the next morning run.

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

concurrency:
  group: radar-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Read 👍/👎 presses
        run: python -m radar feedback
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save memory
        run: |
          git config user.name "lead-radar-bot"
          git config user.email "lead-radar-bot@users.noreply.github.com"
          git add state/state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update radar feedback"
            for i in 1 2 3; do
              git pull --rebase && git push && exit 0
              echo "push attempt $i failed, retrying"; sleep $((i * 5))
            done
            echo "::error::Could not push state/state.json"; exit 1
          fi
